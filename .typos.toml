[files]
# 尊重 .ignore / .gitignore
ignore-dot = true
ignore-files = true
# 跳过无需检查的目录
extend-exclude = [
  "secrets/",
  "assets/",
  "README.md",
]

[default]
# 二进制文件不按文本检查
binary = false
# 检查文件名拼写
check-filename = true
# 忽略这些特殊标识符/项目专有名词
extend-ignore-re = [
  "DankMaterialShell",
  "AvengeMedia",
  "daeuniverse",
  "daed",
  "legion",
  "R7000P",
  "DATATB",
  "rime",
  "niri",
  "sops",
  "typos",
  "lilei",
  "WhiteSur",
  # bigsur/big-sur: macOS Big Sur GRUB theme 包名
  "big-sur",
  "bigsur",
  "BigSur",
  # daA: 股票看板程序名 (~/Documents/daA), 防止被当作 data 的错字
  "daa",
]
